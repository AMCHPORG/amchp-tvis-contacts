name: Weekly TVIS MCH Director Scrape

on:
  schedule:
    # Every Monday at 7:00 AM UTC (2:00 AM CT / 3:00 AM ET)
    - cron: "0 7 * * 1"
  workflow_dispatch:  # Allows manual trigger from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        run: python scrape_tvis.py

      - name: Check for changes
        id: diff
        run: |
          git add data/
          git diff --cached --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated CSVs
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-update TVIS contacts $(date +'%Y-%m-%d')"
          git push

      - name: No changes detected
        if: steps.diff.outputs.changed != 'true'
        run: echo "No contact data has changed since last run."
